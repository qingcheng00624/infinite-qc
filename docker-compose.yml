services:
  infinite-canvas:
    build:
      context: .
      dockerfile: Dockerfile
    image: infinite-canvas-local:dev
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./output:/app/output
      - ./API:/app/API
    restart: unless-stopped
